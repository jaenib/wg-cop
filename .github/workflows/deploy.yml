name: Deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e

            run_priv() {
              if command -v sudo >/dev/null 2>&1; then
                sudo "$@"
              else
                "$@"
              fi
            }

            cd /usr/bots/wg_cop
            git config --global --get-all safe.directory | grep -Fxq /usr/bots/wg_cop || \
              git config --global --add safe.directory /usr/bots/wg_cop
            git fetch origin main
            git checkout -f main
            git reset --hard origin/main
            git clean -fd

            if ! command -v tesseract >/dev/null 2>&1; then
              run_priv env DEBIAN_FRONTEND=noninteractive dpkg --configure -a
              run_priv apt-get update
              run_priv env DEBIAN_FRONTEND=noninteractive apt-get install -y \
                tesseract-ocr \
                tesseract-ocr-deu \
                tesseract-ocr-eng
            fi

            if [ ! -x ./venv/bin/python ]; then
              python3 -m venv venv
            fi
            ./venv/bin/python -m pip install -q --upgrade pip
            ./venv/bin/python -m pip install -q -r requirements.txt
            run_priv systemctl restart wg_cop
